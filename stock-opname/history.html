<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">

    <title>Riwayat Stock Opname</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">

</head>

<body>

<a href="../index.html" style="position:fixed;top:14px;left:14px;z-index:999;background:rgba(0,0,0,.35);color:#fff;text-decoration:none;font-size:13px;font-weight:600;padding:7px 12px;border-radius:20px;">← Menu Utama</a>

<div class="container">

    <h2>RIWAYAT STOCK OPNAME</h2>

    <div class="filter-box">

        <label>Dari Tanggal</label>

        <input
            type="date"
            id="startDate">

        <label>Sampai Tanggal</label>

        <input
            type="date"
            id="endDate">

        <button onclick="filterHistory()">
            FILTER
        </button>

        <button onclick="resetFilter()">
            RESET
        </button>

    </div>

    <br>

    <div id="bulkActionBar" style="display:none;margin-bottom:10px;gap:8px;flex-wrap:wrap;">

        <button onclick="exportSelectedHistory()" style="background:#1A5FB4;">
            ⬇ Export Terpilih (<span id="selectedExportCount">0</span>)
        </button>

        <button id="deleteSelectedBtn" onclick="deleteSelectedHistory()" style="background:#C23B2E;display:none;">
            🗑 Hapus Terpilih (<span id="selectedDeleteCount">0</span>)
        </button>

    </div>

    <div id="historyList">

        <div class="empty-history">

            <div class="empty-icon">
                📋
            </div>

            <h3>
                Belum ada data ditampilkan
            </h3>

            <p>
                Pilih tanggal terlebih dahulu,
                kemudian tekan tombol FILTER.
            </p>

        </div>

    </div>

    <br>

    <button onclick="window.location.href='index.html'">

        KEMBALI KE MENU UTAMA

    </button>

</div>

<div class="watermark">
    © 2026 Fdl
</div>

<script src="../shared/local-db.js?v=1"></script>

<script src="../shared/ui-dialog.js?v=41"></script>
<script src="libraries/xlsx.full.min.js"></script>
<script src="history.js?v=3"></script>

</body>

</html>
